[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ga4-analytics"
version = "0.1.0"
description = "Funnel, attribution, metric-tree and anomaly analysis over a GA4-schema ecommerce event export, on DuckDB."
readme = "README.md"
license = "MIT"
authors = [{ name = "Farhan Patel" }]
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
app = ["streamlit>=1.38", "plotly>=5.24"]
notebooks = ["nbformat>=5.10", "nbclient>=0.10", "ipykernel>=6.29"]
dev = ["pytest>=8.2", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/farhanpatel-dev/ga4-ecommerce-analytics"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Notebook sources: bare expressions display output, and imports may sit next to the cell using them.
"notebooks/src/*.py" = ["B018", "E402", "E501"]
